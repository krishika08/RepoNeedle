name: Release & Publish

run-name: "Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }} (${{ github.event_name }})"

on:
  # Normal release path: pushing a version tag.
  push:
    tags:
      - 'v*'
  # Manual path for a tag that already exists (for example, a release whose tag-push run used an
  # older version of this workflow). It must be dispatched from `main`. Both the validation and
  # build jobs check out the requested tag, never the `main` tree.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to validate, build and publish (for example v1.2.0). Dispatch from main."
        required: true
        type: string

permissions:
  contents: read

env:
  # The release tag for this run: the pushed tag, or the `tag` input of a manual dispatch.
  # Shell steps read it only through this environment variable, never through `${{ }}`
  # interpolation inside a script.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

# Never run two releases of the same tag at the same time (for example a tag push and a dispatch).
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Version & Run Release Test Suite
    runs-on: ubuntu-latest
    # Test job: read-only, no OIDC token, no publishing credentials.
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release-commit.outputs.commit }}

    steps:
      - name: Check release trigger and tag name
        run: |
          set -euo pipefail
          tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?$'
          if ! [[ "${RELEASE_TAG}" =~ $tag_pattern ]]; then
            echo "::error::Release tag must look like v1.2.3 (optionally with a1/b1/rc1 or .post1); refusing to release."
            exit 1
          fi
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} release_tag=${RELEASE_TAG}"
          case "${GITHUB_EVENT_NAME}" in
            push)
              if [ "${GITHUB_REF}" != "refs/tags/${RELEASE_TAG}" ]; then
                echo "::error::Tag-push run for ${GITHUB_REF} does not match release tag ${RELEASE_TAG}."
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
                echo "::error::Manual releases must be dispatched from main, not ${GITHUB_REF}."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported release trigger: ${GITHUB_EVENT_NAME}."
              exit 1
              ;;
          esac

      - name: Checkout the release tag (full history and tags)
        uses: actions/checkout@v4
        with:
          # Full history and all tags: the test suite verifies historical tags and commits
          # (for example v0.1.0-baseline), which a shallow checkout does not contain.
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out commit is the release tag
        id: release-commit
        run: |
          set -euo pipefail
          if ! tag_commit="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}")"; then
            echo "::error::Tag ${RELEASE_TAG} does not exist."
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${head_commit}" ]; then
            echo "::error::Checked-out HEAD ${head_commit} is not tag ${RELEASE_TAG} (${tag_commit})."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            pushed_commit="$(git rev-parse --verify --quiet "${GITHUB_SHA}^{commit}")" || pushed_commit=""
            if [ "${pushed_commit}" != "${head_commit}" ]; then
              echo "::error::Tag ${RELEASE_TAG} now points to ${head_commit}, not the pushed commit ${GITHUB_SHA}."
              exit 1
            fi
          else
            if ! git merge-base --is-ancestor "${head_commit}" refs/remotes/origin/main; then
              echo "::error::Tag ${RELEASE_TAG} (${head_commit}) is not on main; refusing a manual release."
              exit 1
            fi
          fi
          echo "Release ${RELEASE_TAG} -> ${head_commit}"
          echo "commit=${head_commit}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with development, MCP and demo-API extras
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,mcp,api]"

      - name: Verify tag, pyproject version and package __version__ match
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          import reponeedle
          tag = os.environ["RELEASE_TAG"]
          tag_version = tag[1:] if tag.startswith("v") else tag
          project_version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          package_version = reponeedle.__version__
          print(f"tag={tag} tag_version={tag_version} pyproject={project_version} __version__={package_version}")
          if not (tag_version == project_version == package_version):
              sys.exit("Version mismatch: refusing to release. Tag, pyproject.toml and reponeedle.__version__ must agree.")
          EOF

      - name: Run full test suite
        run: |
          pytest -q -rs

      - name: Run MCP and security suites (any skip fails the release)
        env:
          REPONEEDLE_FAIL_ON_SKIP: "1"
        run: |
          pytest -q -rs \
            tests/test_mcp_server.py \
            tests/test_mcp_tools.py \
            tests/test_mcp_optional_dependency.py \
            tests/test_indexing_security.py \
            tests/test_release_compat.py

  build:
    name: Build & Validate Distributions
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the release tag (full history and tags)
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out commit is the validated release commit
        env:
          VALIDATED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          if ! tag_commit="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}")"; then
            echo "::error::Tag ${RELEASE_TAG} does not exist."
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [ -z "${VALIDATED_COMMIT}" ] || [ "${head_commit}" != "${tag_commit}" ] || [ "${head_commit}" != "${VALIDATED_COMMIT}" ]; then
            echo "::error::Build checkout ${head_commit} does not match tag ${RELEASE_TAG} (${tag_commit}) and the validated commit (${VALIDATED_COMMIT:-none})."
            exit 1
          fi
          echo "Building ${RELEASE_TAG} from ${head_commit}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution metadata with Twine
        run: |
          python -m twine check --strict dist/*

      - name: Verify built artifacts carry the tagged version
        run: |
          VERSION="${RELEASE_TAG#v}"
          test -f "dist/reponeedle-${VERSION}-py3-none-any.whl" || { echo "Wheel for ${VERSION} not found"; ls dist; exit 1; }
          test -f "dist/reponeedle-${VERSION}.tar.gz" || { echo "sdist for ${VERSION} not found"; ls dist; exit 1; }

      - name: Generate and record SHA-256 checksums
        run: |
          mkdir -p checksums
          cd dist
          sha256sum * > ../checksums/SHA256SUMS
          cd ..
          cat checksums/SHA256SUMS
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### Distribution SHA-256 Checksums" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat checksums/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload distribution packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload SHA-256 checksums as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: checksums/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI (OIDC Trusted Publishing)
    # Only after version validation, the full test suite and a verified build have succeeded.
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reponeedle
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
