name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution metadata with Twine
        run: |
          python -m twine check --strict dist/*

      - name: Generate and record SHA-256 checksums
        run: |
          mkdir -p checksums
          cd dist
          sha256sum * > ../checksums/SHA256SUMS
          cd ..
          cat checksums/SHA256SUMS
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### Distribution SHA-256 Checksums" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat checksums/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload distribution packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload SHA-256 checksums as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: checksums/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI (OIDC Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reponeedle
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
