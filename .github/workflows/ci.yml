name: CI

on:
  push:
    branches:
      - main
      - v1.0-zero-failure
      - v1.1-*
      - release/*
  pull_request:
    branches:
      - main
      - v1.0-zero-failure
      - v1.1-*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Production CI (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e ".[dev]"

      - name: Run test suite
        run: |
          pytest -q -rs

      - name: Build distribution packages
        run: |
          python -m build

      - name: CLI Smoke Test (Default Legacy Ranker)
        run: |
          reponeedle "test query" --repo . --budget 500

      - name: CLI Smoke Test (Opt-in Change-Impact Ranker)
        run: |
          reponeedle "test query" --repo . --budget 500 --ranker change_impact

  research-parity:
    name: Research Benchmark Parity (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned agent-retrieval-bench dependency
        uses: actions/checkout@v4
        with:
          repository: eyuansu62/agent-retrieval-bench
          ref: 9e4d68937f29d5967afd62f4f6a24c1478298133
          path: external/agent-retrieval-bench

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e ".[dev]"

      - name: Run research benchmark parity tests
        run: |
          pytest tests/test_arm101_production_parity.py tests/test_stage3_7_metrics.py tests/test_stage3_8_reproducibility.py -v
