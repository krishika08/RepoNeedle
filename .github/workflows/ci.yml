name: CI

on:
  push:
    branches:
      - main
      - v1.0-zero-failure
      - v1.1-*
      - release/*
  pull_request:
    branches:
      - main
      - v1.0-zero-failure
      - v1.1-*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Production CI (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e ".[dev,api]"

      - name: Run test suite
        run: |
          pytest -q -rs

      - name: Build distribution packages
        run: |
          python -m build

      - name: CLI Smoke Test (Default Legacy Ranker)
        run: |
          reponeedle "test query" --repo . --budget 500

      - name: CLI Smoke Test (Opt-in Change-Impact Ranker)
        run: |
          reponeedle "test query" --repo . --budget 500 --ranker change_impact

  mcp-security-linux:
    name: MCP & Indexing Security (Linux, Python 3.12, skips fail)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with development and MCP extras
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,mcp]"

      - name: Verify optional MCP dependencies are importable
        run: |
          python -c "import mcp, pytest_asyncio; print('mcp and pytest-asyncio available')"

      - name: Run MCP, symlink-security and compatibility suites (any skip fails the job)
        env:
          REPONEEDLE_FAIL_ON_SKIP: "1"
        run: |
          pytest -q -rs \
            tests/test_mcp_server.py \
            tests/test_mcp_tools.py \
            tests/test_mcp_optional_dependency.py \
            tests/test_indexing_security.py \
            tests/test_release_compat.py \
            tests/test_abstention_opt_in.py \
            tests/test_indexing_diagnostics.py \
            tests/test_documentation_consistency.py \
            tests/test_tree_sitter_fallback.py

      - name: MCP STDIO smoke test (initialize; reports RepoNeedle version)
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 120 python -m reponeedle.mcp --repo . 2>/dev/null | head -n 1 > init.json
          python -c "import json, reponeedle; r = json.load(open('init.json')); info = r['result']['serverInfo']; assert info == {'name': 'reponeedle', 'version': reponeedle.__version__}, info; print('serverInfo OK:', info)"

  tree-sitter-optional:
    name: Tree-sitter extraction (${{ matrix.label }}, skips fail)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10", label: "Linux, Python 3.10", minimum: false }
          - { os: ubuntu-latest, python-version: "3.11", label: "Linux, Python 3.11", minimum: false }
          - { os: ubuntu-latest, python-version: "3.12", label: "Linux, Python 3.12", minimum: false }
          - { os: ubuntu-latest, python-version: "3.10", label: "Linux, Python 3.10, minimum versions", minimum: true }
          - { os: macos-latest, python-version: "3.12", label: "macOS, Python 3.12", minimum: false }
          - { os: windows-latest, python-version: "3.12", label: "Windows, Python 3.12", minimum: false }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with the treesitter extra (prebuilt wheels only)
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          BINARY="tree-sitter,tree-sitter-typescript,tree-sitter-go,tree-sitter-rust,tree-sitter-java,tree-sitter-cpp"
          if [ "${{ matrix.minimum }}" = "true" ]; then
            # Lower bounds of the `treesitter` extra.
            printf '%s\n' tree-sitter==0.25.2 tree-sitter-typescript==0.23.2 tree-sitter-go==0.25.0 \
              tree-sitter-rust==0.24.2 tree-sitter-java==0.23.5 tree-sitter-cpp==0.23.4 > ts-constraints.txt
            pip install --only-binary="$BINARY" -c ts-constraints.txt -e ".[dev,treesitter]"
          else
            pip install --only-binary="$BINARY" -e ".[dev,treesitter]"
          fi
          pip list | grep -i "tree-sitter"

      - name: Report parser availability (fails if any grammar cannot load)
        run: |
          python -c "import json; from reponeedle.core.tree_sitter_extraction import tree_sitter_status as s; st = s(); print(json.dumps(st, indent=1)); assert st['runtime']['available'] and all(v['available'] for v in st['languages'].values())"

      - name: Run Tree-sitter and function-graph suites (any skip fails the job)
        env:
          REPONEEDLE_FAIL_ON_SKIP: "1"
        run: |
          pytest -q -rs tests/test_tree_sitter_extraction.py tests/test_tree_sitter_graph.py tests/test_tree_sitter_fallback.py tests/test_stage3_11_function_graph.py tests/test_stage3_21_production_quality.py tests/test_hf_space_bundle.py

  package-install:
    name: Wheel install with and without the treesitter extra (Linux, Python 3.12)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Base install (no Tree-sitter packages)
        run: |
          python -m venv /tmp/base
          /tmp/base/bin/pip install dist/*.whl
          if /tmp/base/bin/pip list 2>/dev/null | grep -i "tree-sitter"; then
            echo "::error::A base install must not pull Tree-sitter packages"; exit 1
          fi
          cd /tmp && /tmp/base/bin/python "$GITHUB_WORKSPACE/reports/v2_completion/tree_sitter/install_smoke.py" absent

      - name: Install with the treesitter extra
        run: |
          python -m venv /tmp/ts
          WHEEL=$(ls dist/*.whl)
          /tmp/ts/bin/pip install --only-binary=tree-sitter,tree-sitter-typescript,tree-sitter-go,tree-sitter-rust,tree-sitter-java,tree-sitter-cpp "${WHEEL}[treesitter]"
          /tmp/ts/bin/pip list | grep -i "tree-sitter"
          cd /tmp && /tmp/ts/bin/python "$GITHUB_WORKSPACE/reports/v2_completion/tree_sitter/install_smoke.py" present

  research-parity:
    name: Research Benchmark Parity (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned agent-retrieval-bench dependency
        uses: actions/checkout@v4
        with:
          repository: eyuansu62/agent-retrieval-bench
          ref: 9e4d68937f29d5967afd62f4f6a24c1478298133
          path: external/agent-retrieval-bench

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e ".[dev]"

      - name: Run research benchmark parity tests
        run: |
          pytest tests/test_arm101_production_parity.py tests/test_stage3_7_metrics.py tests/test_stage3_8_reproducibility.py -v
