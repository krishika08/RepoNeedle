[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reponeedle"
version = "1.1.0"
description = "Token-Budget-Aware, Workflow-Adaptive Repository Context Retrieval for AI Coding Agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "RepoNeedle Contributors" }]
keywords = ["code-retrieval", "ai-agents", "context-selection", "token-budget", "repository-retrieval", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "pydantic>=2.0.0",
    "pathspec>=0.11.0",
    "rich>=13.0.0",
    "tomli>=2.0.1; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
hf = [
    "huggingface_hub>=0.20.0",
    "gradio>=4.0.0",
]

[project.scripts]
reponeedle = "reponeedle.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reponeedle*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
