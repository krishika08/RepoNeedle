[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reponeedle"
version = "1.2.0"
description = "Token-Budget-Aware, Workflow-Adaptive Repository Context Retrieval for AI Coding Agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "RepoNeedle Contributors" }]
keywords = ["code-retrieval", "ai-agents", "context-selection", "token-budget", "repository-retrieval", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "pydantic>=2.0.0",
    "pathspec>=0.11.0",
    "rich>=13.0.0",
    "tomli>=2.0.1; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23",
]
# Optional dependencies for the repository's public demonstration API (`api.py` at the repository
# root; not part of the installed package). Published with 1.1.0; kept for installation compatibility.
api = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.24",
    "uvicorn[standard]>=0.30,<1.0",
]
hf = [
    "huggingface_hub>=0.20.0",
    "gradio>=4.0.0",
]
mcp = [
    "mcp>=1.28,<2",
]
# Optional Tree-sitter structural extraction for the function-level call graph (opt-in with
# AblationConfig(structural_parser="tree_sitter")). The grammars are installed without their `[core]`
# extras: the Go and Rust grammars are ABI 15 and need runtime >= 0.25, although their `[core]` extras
# allow older runtimes. Bounds are the tested versions (see reports/v2_completion/tree_sitter/REPORT.md).
treesitter = [
    "tree-sitter>=0.25.2,<0.27",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-rust>=0.24.2,<0.25",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-cpp>=0.23.4,<0.24",
]

[project.scripts]
reponeedle = "reponeedle.cli:main"
reponeedle-mcp = "reponeedle.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reponeedle*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
